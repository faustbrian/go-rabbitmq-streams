schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: otel
      archive: .verification/mutation/bootstrap/otel.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: rabbitmq
      archive: .verification/mutation/bootstrap/rabbitmq.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
    - module: otel
      mode: apidiff
      path: otel/api/baseline.txt
    - module: rabbitmq
      mode: apidiff
      path: rabbitmq/api/baseline.txt

operations:
  - module: rabbitmq
    gate: conformance
    steps:
      - type: go-test
        packages: [.]
        run: '^(TestWireMessagePreservesLanguageNeutralEventMetadata|TestWireDeliveryCopiesAndNormalizesLanguageNeutralMetadata|TestWireDeliveryRejectsUnsupportedMetadataWithoutLeakingIt|TestConfirmationClassificationPreservesAmbiguity|TestRabbitProducerSessionConfirmationAdmissionOrdering|TestRabbitProducerSessionFailureAndAbortAreSingleTerminalTransitions|TestStoredStartResolvesTheBrokerOffsetBeforeOpeningTheConsumer|TestRabbitConsumerSessionStoresOnlyOwnedBoundedOffsets|TestConsumerTransportStoreOffsetRetriesOnlyConnectionFailures|TestReplaySourceRejectsUnavailableAndChangedHistoryBoundaries|TestReplayCursorAcceptsOnlyTheRequestedActiveRange|TestConsumerStartPositionMapsWithoutSemanticSubstitution|TestHashRoutingIsStableForAnOrderedPartitionTopology|TestRabbitSuperProducerSessionRoutesAndRejectsUnavailablePartitions|TestReplayTopologyMustRemainExactAndOrdered|TestEnvironmentOptionsPreserveConnectionSecurityPolicy|TestOpenProducerHonorsCancellationBeforeCredentialResolution|TestSessionOpeningRetriesBrokerAuthenticationButNotPermanentFailure)$'
        count: 1
        timeout: 10m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzMessageValidationAndOwnership$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzConnectionConfigNormalization$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzReplayRequestValidation$'
        budget: 100x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: otel
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPropagationOwnershipAndBounds$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzObservationIsolation$'
        budget: 100x
        timeout: 2m
  - module: otel
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: rabbitmq
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzWireMessageRoundTrip$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzHashPartition$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzConfirmationClassification$'
        budget: 100x
        timeout: 2m
  - module: rabbitmq
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
