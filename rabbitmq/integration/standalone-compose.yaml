name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME to a task-owned value}

services:
  rabbit:
    image: rabbitmq@sha256:397fde82bc04522d88680b57cbf5d70caae715a76c957404e52e3f0fa056b8f3
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITSTREAM_USER:?set RABBITSTREAM_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITSTREAM_PASSWORD:?set RABBITSTREAM_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITSTREAM_ERLANG_COOKIE:?set RABBITSTREAM_ERLANG_COOKIE}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_stream advertised_host localhost advertised_port 15552
    networks:
      - rabbitstream
    volumes:
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./standalone.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - type: volume
        source: rabbit-data
        target: /var/lib/rabbitmq/mnesia
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 1s
      timeout: 5s
      retries: 60
    restart: "no"

  proxy:
    image: ghcr.io/shopify/toxiproxy@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0"]
    depends_on:
      rabbit:
        condition: service_healthy
    networks:
      - rabbitstream
    ports:
      - "15552:15552"
      - "18474:8474"
    restart: "no"

networks:
  rabbitstream:
    labels:
      codex.task: rabbitstream-standalone

volumes:
  rabbit-data:
    labels:
      codex.task: rabbitstream-standalone
